<!DOCTYPE html>
<html lang="pt-br">

<head>
    <link rel="shortcut icon" href="../assets/icon/favicon2.ico" type="image/x-icon">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FutDelas | Dashboards</title>


    <link rel="stylesheet" href="./../css/dashboards.css">
    <link rel="stylesheet" href="./../css/estilo.css" />
    <script src="../js/sessao.js"></script>
    <script src="./../js/alerta.js"></script>

    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">

    <!-- scripts do Chart.js - 2022-1 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!--FONT AWESOME-->
    <script src="https://kit.fontawesome.com/9f7414eb10.js" crossorigin="anonymous"></script>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<!-- <body onload=" atualizarFeed()"> -->

<body style="position: fixed; width: 100%; height: 100%;">

    <div class="janela">
        <div class="header-left">
            <h1>FutDelas</h1>

            <div class="hello">
                <h3>Olá, <span id="b_usuario">usuário</span>!</h3>
            </div>

            <div class="btn-nav-white">
                <a href="../buscarEscolinhasAdm.html">
                    <h3>Buscar Escolas</h3>
                </a>
            </div>

            <div class="btn-nav">
                <a href="#">
                    <h3>Gráficos</h3>
                </a>
            </div>

            <div class="btn-logout" onclick="limparSessao()">
                <h3>Sair</h3>
            </div>

        </div>

        <div class="dash-busca">

            <h2 class="titulo-dashboard">Painel de Controle em Tempo Real</h2>

            <div class="container-kpi">

                <div class="kpi">
                    <p>Total de escolas em Diadema</p>
                    <h1 id="totalEscolinhas"></h1>
                </div>

                <div class="kpi">
                    <p>Escolas no seu bairro</p>
                    <h1 id="bairro"></h1>
                </div>

                <div class="kpi">
                    <p>Porcentagem de bairros desprovidos de escolas.</p>
                    <h1 id="nulos"></h1>
                </div>

            </div>

            <div class="container-botaos">
                <div class="div_botaos">
                    <p>Quantidade de escolas em cada bairro:</p>
                    <canvas id="myChart"></canvas>
                </div>

                <div class="div_botaos">
                    <p>Top 3 bairros mais procurados:</p>
                    <canvas id="myChart2"></canvas>
                </div>
            </div>
        </div>
    </div>


</body>

</html>

<script>
    b_usuario.innerHTML = sessionStorage.NOME_USUARIO;

    window.onload = chamar();

    function chamar(){
        mostrarEscolasBairro()
        totalEscolasDiadema()
        bairrosSemEscolas()
        graficoTotalEscolas()
        bairrosTopTres()
    }

    function mostrarEscolasBairro() {
        var idEscola = sessionStorage.ID_ESCOLA

        fetch("/escolinhas/bairroEscola", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({
                // crie um atributo que recebe o valor recuperado aqui
                // Agora vá para o arquivo routes/usuario.js
                idEscolaServer: idEscola
            }),
        })
            .then(function (resposta) {
                console.log("resposta: ", resposta);

                if (resposta.ok) {

                    resposta.json().then(function (dados) {
                        bairro.innerHTML = `${dados[0].quantidade}`
                    });

                } else {
                    throw "Houve um erro ao tentar procurar o bairro!";
                }
            })
            .catch(function (resposta) {
                console.log(`#ERRO: ${resposta}`);
                finalizarAguardar();
            });
        return false;
    }

    function totalEscolasDiadema(){
        fetch("/usuarios/total", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            }
        })
            .then(function (resposta) {
                console.log("resposta: ", resposta);
    
                if (resposta.ok) {
                    resposta.json().then(function (dados) {
                        totalEscolinhas.innerHTML = `${dados[0].total}`
                    });
    
                } else {
                    throw "Houve um erro ao tentar procurar o bairro!";
                }
            })
            .catch(function (resposta) {
                console.log(`#ERRO: ${resposta}`);
                finalizarAguardar();
            });
        return false;
    }

    function bairrosSemEscolas(){
        fetch("/usuarios/nulos", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            }
        })
            .then(function (resposta) {
                console.log("resposta: ", resposta);
    
                if (resposta.ok) {
                    resposta.json().then(function (dados) {
                        let total = 11;
                        nulos.innerHTML = `${((dados[0].nulos / total) * 100).toFixed(2)}%`;
                    });
    
                } else {
                    throw "Houve um erro ao tentar procurar o bairro!";
                }
            })
            .catch(function (resposta) {
                console.log(`#ERRO: ${resposta}`);
                finalizarAguardar();
            });
        return false;
    }

    function graficoTotalEscolas(){
        fetch("/busca/contar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            }
        })
            .then(function (resposta) {
                console.log("ESTOU NO THEN DO entrar()!")


                if (resposta.ok) {
                    console.log(resposta);

                    resposta.json().then(function (dados) {
                        var bairros = [];
                        var totais = [];

                        for (var i = 0; i < dados.length; i++) {

                            bairros.push(dados[i].bairro);
                            totais.push(dados[i].total);

                        }

                        const ctx = document.getElementById('myChart');

                        new Chart(ctx, {
                            type: 'bar',

                            data: {
                                labels: bairros,

                                datasets: [{
                                    label: '',
                                    data: totais,
                                    backgroundColor: [
                                        '#ff4d4d',
                                        '#4d79ff',
                                        '#00ff88',
                                        '#ffb84d',
                                        '#b84dff',
                                        '#00cccc',
                                        '#ff66b3',
                                        '#66ff66',
                                        '#cccc00',
                                        '#ff884d'
                                    ],
                                    borderWidth: 1
                                }]
                            },
                            options: {
                                indexAxis: 'y',
                                plugins: {
                                    legend: {
                                        display: false
                                    }
                                },
                            }
                        });
                    });

                }
                else {
                    console.log("Houve um erro ao tentar procurar escolinhas!");
                    resposta.text().then(texto => {
                        console.error(texto);
                    });
                }

            }).catch(function (erro) {
                console.log(erro);
            })
        return false;
    }

    function bairrosTopTres(){
        fetch("/busca/maisBuscados", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            }
        })
            .then(function (resposta) {
                console.log("resposta: ", resposta);
    
                if (resposta.ok) {
                    resposta.json().then(function (dadosProcurados) {
    
                        var bairrosProcurados = [];
                        var totaisProcurados = [];
    
                        for (var i = 0; i < dadosProcurados.length; i++) {
                            bairrosProcurados.push(dadosProcurados[i].bairro);
                            totaisProcurados.push(dadosProcurados[i].total);
                        }
    
                        const ctx = document.getElementById('myChart2');
    
                        new Chart(ctx, {
                            type: 'bar',
    
                            data: {
                                labels: bairrosProcurados,
    
                                datasets: [{
                                    label: '',
                                    data: totaisProcurados,
                                    backgroundColor: [
                                        '#ff4d4d',
                                        '#4d79ff',
                                        '#00ff88',
                                        '#ffb84d',
                                        '#b84dff',
                                        '#00cccc',
                                        '#ff66b3',
                                        '#66ff66',
                                        '#cccc00',
                                        '#ff884d'
                                    ],
                                    borderWidth: 1
                                }]
                            },
                            options: {
                                plugins: {
                                    legend: {
                                        display: false 
                                    }
                                },
                            }
                        });
                    });
    
                } else {
                    throw "Houve um erro ao tentar procurar o bairro!";
                }
            })
            .catch(function (resposta) {
                console.log(`#ERRO: ${resposta}`);
                finalizarAguardar();
            });
    
    
        return false;
    }
</script>
