<script>
    b_usuario.innerHTML = sessionStorage.NOME_USUARIO;

    window.onload = function () {
        var nome = localStorage.getItem("nomeEscolinha");
        var bairro = localStorage.getItem("bairroEscolinha");
        var rua = localStorage.getItem("ruaEscolinha");
        var numero = localStorage.getItem("numeroEscolinha");

        if (nome != null) {

            div_ultima.innerHTML = `<h2>Última escolinha vista:</h2> <br>
                                    <p><b>Nome:</b>${nome}</p>
                                    <p><b>Bairro:</b> ${bairro}</p>
                                    <p><b>Rua:</b> ${rua}</p>
                                    <p><b>Número:</b> ${numero}</p>
            `;
        }
    }

    function bairro(bairroVar) {
        fetch("/busca/contar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                bairroServer: bairroVar
            })
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")


            if (resposta.ok) {
                console.log(resposta);

                resposta.json().then(json => {
                    var cor;

                    if (bairroVar == "Eldorado") {
                        cor = "#00ff88";
                    } else if (bairroVar == "Campanário") {
                        cor = "#ff4d4d";
                    } else if (bairroVar == "Centro") {
                        cor = "#4d79ff";
                    } else if (bairroVar == "Piraporinha") {
                        cor = "#ffb84d";
                    } else if (bairroVar == "Taboão") {
                        cor = "#b84dff";
                    } else if (bairroVar == "Cahema") {
                        cor = "#00cccc";
                    } else if (bairroVar == "Conceição") {
                        cor = "#ff66b3";
                    } else if (bairroVar == "Inamar") {
                        cor = "#66ff66";
                    } else if (bairroVar == "Serraria") {
                        cor = "#cccc00";
                    } else if (bairroVar == "Vila Nogueira") {
                        cor = "#ff884d";
                    }

                    var total = json[0].total;

                    const ctx = document.getElementById('myChart');

                    if (window.grafico) {
                        window.grafico.destroy();
                    }

                    window.grafico = new Chart(ctx, {
                        type: 'doughnut',
                        data: {
                            labels: ['Escolinhas'],
                            datasets: [{
                                label: 'Quantidade',
                                data: [total],
                                backgroundColor: [cor],
                                borderWidth: 1
                            }]
                        }
                    });

                    console.log(json);
                    console.log(JSON.stringify(json));

                    botaos.innerHTML = "";

                    for (var i = 0; i < json.length; i++) {
                        botaos.innerHTML += `${json[i].total}`;

                    }
                    if (json[i].total == 0) {
                        botaos.innerHTML += `Ainda sem escolinhas nesse bairro`
                    }

                });

            }
            else {
                console.log("Houve um erro ao tentar procurar escolinhas!");
                resposta.text().then(texto => {
                    console.error(texto);
                });
            }

        }).catch(function (erro) {
            console.log(erro);
        })

        return false;
    }
