<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/dashboards.css">
    <script src="../js/sessao.js"></script>
</head>

<body>

    <div class="janela">
        <div class="header-left">
            <h1>FutDelas</h1>

            <div class="hello">
                <h3>Olá, <span id="b_usuario">usuário</span>!</h3>
            </div>

            <div class="btn-nav-white">
                <a href="../buscarEscolinhas.html">
                    <h3>Buscar Escolinhas</h3>
                </a>
            </div>

            <div class="btn-nav">
                <a href="./dashboard/dashboard.html">
                    <h3>Gráficos</h3>
                </a>
            </div>


            <div class="btn-logout" onclick="limparSessao()">
                <h3>Sair</h3>
            </div>

        </div>

        <div class="dash-busca">
            <div class="container-escolinha">
                <input type="text" id="input_bairro" placeholder="Buscar por bairro. Ex: Cmapanário.">
                <button onclick="busca()"><img src="./assets/procurar.png" alt=""></button>
            </div>
            <div id="resultado"></div>
        </div>
    </div>

</body>

</html>

<script>
    b_usuario.innerHTML = sessionStorage.NOME_USUARIO;

    function busca() {
        var bairroVar = input_bairro.value;

        fetch("/busca/listar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                bairroServer: bairroVar
            })
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")


            if (resposta.ok) {
                console.log(resposta);

                resposta.json().then(json => {
                    console.log(json);
                    console.log(JSON.stringify(json));

                    resultado.innerHTML = "";

                    if (json.length == 0) {
                        resultado.innerHTML = `Ainda sem escolinhas cadastradas neste bairro`
                    }

                    let tabela = `
                        <table class="tabela">
                        <thead>
                            <tr>
                            <th>Nome</th>
                            <th>Bairro</th>
                            <th>Rua</th>
                            <th>Número</th>
                            <th>Contato</th>
                            </tr>
                        </thead>
                        <tbody>
                    `;

                    for (var i = 0; i < json.length; i++) {
                        tabela += `
                        <tr>
                            <td>${json[i].nome}</td>
                            <td>${json[i].bairro}</td>
                            <td>${json[i].rua}</td>
                            <td>${json[i].numero}</td>
                            <td>${json[i].email}</td>
                        </tr>
                    `;

                    
                    
                    localStorage.setItem("nomeEscolinha", json[i].nome);
                    localStorage.setItem("bairroEscolinha", json[i].bairro);
                    localStorage.setItem("ruaEscolinha", json[i].rua);
                    localStorage.setItem("numeroEscolinha", json[i].numero)
                }
                
                tabela += `
                    </tbody>
                    </table>
                `;
    
                resultado.innerHTML = tabela;
            });

            }
            else {
                console.log("Houve um erro ao tentar procurar escolinhas!");
                resposta.text().then(texto => {
                    console.error(texto);
                });
            }

        }).catch(function (erro) {
            console.log(erro);
        })

        return false;
    }
</script>
