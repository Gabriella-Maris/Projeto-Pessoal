<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>FutDelas | Cadastro</title>

    <script src="./js/sessao.js"></script>

    <link rel="stylesheet" href="./css/estilo.css" />
    <link rel="icon" href="./assets/icon/favicon2.ico" />
    <link rel="preconnect" href="https://fonts.gstatic.com" />
</head>

<body>
    <!--header inicio-->
    <div class="header">
        <div class="container">
            <h1 class="titulo">FutDelas</h1>
            <ul class="navbar">
                <li>
                    <a href="index.html">Inicial</a>
                </li>
                <li>
                    <a href="simulador.html">Simulador</a>
                </li>
                <li>|</li>
                <li>
                    <a href="login.html">Login</a>
                </li>
                <li class="agora">
                    <a href="#">Cadastro</a>
                </li>
            </ul>
        </div>
    </div>
    <!--header fim-->

    <div class="login">
        <div class="alerta_erro">
            <div class="card_erro" id="cardErro">
                <span id="mensagem_erro"></span>
            </div>
        </div>
        <div class="container">
            <div class="card card-cadastro">
                <h2>Bem-vindo!</h2>
                <div class="formulario">
                    <!--
                         Para inserir mais um campo, copie uma das inputs abaixo.
                         Assim que inserir vá para o script abaixo.
                     -->
                    <div class="campos">

                        <div class="campo1">
                            <div class="campo">
                                <span>Nome escolinha:</span>
                                <input id="nome_input" type="text" placeholder="Nome da escolinha" />
                            </div>
                            <div class="campo">
                                <span>CNPJ:</span>
                                <input id="cnpj_input" type="text" placeholder="CNPJ da escolinha" />
                            </div>
                            <div class="campo">
                                <span>Bairro:</span>
                                <input id="bairro_input" type="text" placeholder="Bairro da escolinha" />
                            </div>
                            <div class="campo">
                                <span>Rua:</span>
                                <input id="rua_input" type="text" placeholder="Rua do local" />
                            </div>
                            <div class="campo">
                                <span>Número:</span>
                                <input id="numero_input" type="text" placeholder="Número da residência" />
                            </div>
                        </div>

                        <div class="campo2">
                            <div class="campo">
                                <span>Nome:</span>
                                <input id="nome_representante_input" type="text" placeholder="Seu nome" />
                            </div>
                            <div class="campo">
                                <span>E-mail:</span>
                                <input id="email_input" type="text" placeholder="meuemail@provedor.com" />
                            </div>
                            <div class="campo">
                                <span>CPF:</span>
                                <input id="cpf_input" type="text" placeholder="Seu CPF" />
                            </div>
                            <div class="campo">
                                <span>Senha:</span>
                                <input id="senha_input" type="password" placeholder="******" />
                            </div>
                            <div class="campo">
                                <span>Confirmação da Senha:</span>
                                <input id="confirmacao_senha_input" type="password" placeholder="******" />
                            </div>
                        </div>
                    </div>
                    <button class="botao" onclick="cadastrar()">Cadastrar</button>
                </div>
                <div id="div_aguardar" class="loading-div">
                    <img src="./assets/circle-loading.gif" id="loading-gif" />
                </div>

                <div id="div_erros_login"></div>
            </div>
        </div>
    </div>

    <!--footer inicio-->
    <div class="footer">
        <div class="container">
            <h4>Mais visibilidade, mais igualdade, mais futebol. &hearts; SPTech &copy; 2026</h4>
            <span class="version">v1.0.0</span>
        </div>
    </div>
    <!--footer fim-->
</body>

</html>

<script>

    function cadastrar() {
        // aguardar();

        //Recupere o valor da nova input pelo nome do id
        // Agora vá para o método fetch logo abaixo
        var nomeVar = nome_input.value;
        var emailVar = email_input.value;
        var senhaVar = senha_input.value;
        var confirmacaoSenhaVar = confirmacao_senha_input.value;
        var cpfVar = cpf_input.value;
        var nome_representanteVar = nome_representante_input.value
        var cnpjVar = cnpj_input.value
        var bairroVar = bairro_input.value
        var ruaVar = rua_input.value
        var numeroVar = numero_input.value
        var tamanhoNome = nome_representanteVar.length;
        var tamanhoNomeEscolinha = nomeVar.length
        var tamanhoCnpj = cnpjVar.length
        var temArroba = emailVar.indexOf('@')
        var temPonto = emailVar.indexOf('.')
        var tamanhoSenha = senhaVar.length
        var tamanhoCpf = cpfVar.length

        // Verificando se há algum campo em branco
        var campos = [
            nome_input,
            email_input,
            cpf_input,
            senha_input,
            confirmacao_senha_input,
            nome_representante_input,
            cnpj_input,
            bairro_input,
            rua_input,
            numero_input
        ];

        for (var i = 0; i < campos.length; i++) {
            if (campos[i].value == "") {
                cardErro.style.display = "block";
                mensagem_erro.innerHTML = "Preencha todos os campos!";
                return false;
            }
        }

        // Verificando se há algum campo inválido

        if (tamanhoNomeEscolinha <= 1) {
            cardErro.style.display = "block";
            mensagem_erro.innerHTML = `Nome da escolinha inválido`

            finalizarAguardar();
            return false;
        } else {
            setInterval(sumirMensagem, 5000);
        }

        if (tamanhoCnpj != 14) {
            cardErro.style.display = "block";
            mensagem_erro.innerHTML = `CNPJ inválido`

            finalizarAguardar();
            return false;
        } else {
            setInterval(sumirMensagem, 5000);
        }

        var bairrosValidos = [
            'Campanário', 'Eldorado', 'Centro', 'Piraporinha',
            'Taboão', 'Canhema', 'Conceição', 'Inamar',
            'Serraria', 'Vila Nogueira'
        ];

        if (!bairrosValidos.includes(bairroVar)) {
            cardErro.style.display = "block";
            mensagem_erro.innerHTML = `Bairro inválido (selecione um bairro de Diadema)`

            finalizarAguardar();
            return false;
        } else {
            setInterval(sumirMensagem, 5000);
        }

        if (tamanhoNome <= 1) {
            cardErro.style.display = "block";
            mensagem_erro.innerHTML = `Nome inválido`

            finalizarAguardar();
            return false;
        } else {
            setInterval(sumirMensagem, 5000);
        }

        if (temArroba == -1) {
            cardErro.style.display = "block";
            mensagem_erro.innerHTML = `E-mail deve conter @`

            finalizarAguardar();
            return false;
        } else if (temPonto == -1) {
            cardErro.style.display = "block";
            mensagem_erro.innerHTML = `E-mail deve conter .`

            finalizarAguardar();
            return false;
        } else {
            setInterval(sumirMensagem, 5000);
        }

        if (tamanhoCpf != 11) {
            cardErro.style.display = "block";
            mensagem_erro.innerHTML = `CPF inválido`

            finalizarAguardar();
            return false;
        } else {
            setInterval(sumirMensagem, 5000);
        }

        if (tamanhoSenha <= 6) {
            cardErro.style.display = "block";
            mensagem_erro.innerHTML = `Senha deve ser maior que 6`

            finalizarAguardar();
            return false;
        } else {
            setInterval(sumirMensagem, 5000);
        }

        if (confirmacaoSenhaVar != senhaVar) {
            cardErro.style.display = "block";
            mensagem_erro.innerHTML = `Erro na confirmação de senha`

            finalizarAguardar();
            return false;
        } else {
            setInterval(sumirMensagem, 5000);
        }

        // Enviando o valor da nova input
        fetch("/escolinhas/cadastrar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({
                // crie um atributo que recebe o valor recuperado aqui
                // Agora vá para o arquivo routes/usuario.js
                nomeServer: nomeVar,
                emailServer: emailVar,
                senhaServer: senhaVar,
                cpfServer: cpfVar,
                nome_representanteServer: nome_representanteVar,
                cnpjServer: cnpjVar,
                bairroServer: bairroVar,
                ruaServer: ruaVar,
                numeroServer: numeroVar
            }),
        })
            .then(function (resposta) {
                console.log("resposta: ", resposta);

                if (resposta.ok) {
                    cardErro.style.display = "block";

                    mensagem_erro.innerHTML =
                        "Cadastro realizado com sucesso! Redirecionando para tela de Login...";

                    setTimeout(() => {
                        window.location = "login.html";
                    }, "2000");

                    limparFormulario();
                    finalizarAguardar();
                } else {
                    throw "Houve um erro ao tentar realizar o cadastro!";
                }
            })
            .catch(function (resposta) {
                console.log(`#ERRO: ${resposta}`);
                finalizarAguardar();
            });

        return false;
    }

    function sumirMensagem() {
        cardErro.style.display = "none";
    }
</script>
